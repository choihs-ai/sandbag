<title>샌드백 패기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: 격투게임식 HUD 위, 체육관 스포트라이트 아래 매달린 샌드백, 하단 무기 선택 */
:root {
  --bg: #140d10;
  --stage: #22161a;
  --ink: #f6efe9;
  --muted: #b5a29e;
  --gold: #ffc93c;
  --red: #e8322f;
  --line: #3b2a2f;
  --chip: #2a1c21;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  max-width: 900px;
  margin: 0 auto;
}
.hud, .toolbar {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { padding-block: 12px 6px; display: grid; gap: 6px; }
.hp-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.nameplate {
  font-family: var(--display);
  font-size: 20px;
  letter-spacing: 0.02em;
  max-width: 9em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hpbar {
  position: relative;
  height: 18px;
  background: #0b0607;
  border: 2px solid var(--ink);
  transform: skewX(-14deg);
  overflow: hidden;
}
.hp-trail, .hp-fill { position: absolute; inset: 0 auto 0 0; width: 100%; }
.hp-trail { background: var(--red); transition: width 0.6s ease 0.35s; }
.hp-fill { background: linear-gradient(180deg, #fff1a8, var(--gold) 45%, #e59a12); transition: width 0.08s linear; }
.hp-fill.low { background: linear-gradient(180deg, #ffb3a8, #ff5a3c 45%, #b8201a); }
.hpnum { font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
.stats { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }

.stage {
  position: relative;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  background:
    radial-gradient(ellipse 55% 70% at 50% 38%, rgba(255, 214, 160, 0.16), transparent 70%),
    linear-gradient(180deg, var(--stage), var(--bg) 92%);
  cursor: crosshair;
}
.stage.mouse { cursor: none; }
canvas { display: block; width: 100%; height: 100%; }
.combo {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: 14px;
  font-family: var(--display);
  color: var(--gold);
  text-align: right;
  line-height: 1;
  text-shadow: 0 3px 0 #7a2a00, 0 0 18px rgba(255, 170, 40, 0.45);
  pointer-events: none;
}
.combo .n { font-size: 46px; display: block; font-variant-numeric: tabular-nums; }
.combo .l { font-size: 16px; letter-spacing: 0.12em; }
.combo.bump { animation: bump 0.16s ease-out; }
@keyframes bump { from { transform: scale(1.35); } to { transform: scale(1); } }
.hint {
  position: absolute;
  left: 0; right: 0; bottom: 12px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  pointer-events: none;
  padding-inline: 16px;
}
.drop {
  position: absolute; inset: 10px;
  border: 3px dashed var(--gold);
  border-radius: 14px;
  display: grid; place-items: center;
  font-family: var(--display); font-size: 24px; color: var(--gold);
  background: rgba(20, 13, 16, 0.75);
  pointer-events: none;
}
.ko {
  position: absolute; inset: 0;
  display: grid; place-content: center; justify-items: center; gap: 12px;
  background: rgba(10, 5, 7, 0.62);
  text-align: center;
  padding-inline: 16px;
}
.ko-title {
  font-family: var(--display);
  font-size: clamp(72px, 22vw, 140px);
  line-height: 0.9;
  color: var(--red);
  -webkit-text-stroke: 3px var(--ink);
  text-shadow: 0 6px 0 #4a0d0c;
  animation: slam 0.45s cubic-bezier(.2, 1.6, .4, 1);
}
@keyframes slam { from { transform: scale(3) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.ko p { margin: 0; font-size: 16px; font-weight: 700; text-wrap: balance; }
.ko-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.toolbar { padding-block: 10px 12px; display: grid; gap: 10px; border-top: 1px solid var(--line); background: var(--bg); }
.row1 { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.btn, button {
  font: 700 14px/1 var(--body);
  color: var(--ink);
  background: var(--chip);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 12px;
  white-space: nowrap;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.primary, button.primary { background: var(--gold); color: #2a1300; border-color: var(--gold); }
button:focus-visible, .btn:focus-within, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#nameInput {
  width: 0;
  flex: 1 1 80px; min-width: 0;
  font: 500 14px var(--body);
  color: var(--ink);
  background: var(--chip);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  -webkit-user-select: text; user-select: text;
}
#nameInput::placeholder { color: var(--muted); }
.weapons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.weapon {
  flex-direction: column; gap: 4px;
  padding: 8px 4px;
  font-size: 12px;
  font-weight: 700;
}
.weapon .e { font-size: 24px; line-height: 1; }
.weapon .k { font-size: 10px; color: var(--muted); font-weight: 500; }
.weapon[aria-checked="true"] { border-color: var(--gold); background: #3a2610; box-shadow: inset 0 0 0 1px var(--gold); }
@media (max-width: 480px) {
  .weapons { grid-template-columns: repeat(3, 1fr); }
  .weapon .k { display: none; }
  .nameplate { font-size: 17px; }
}
</style>

<div class="app">
  <header class="hud">
    <div class="hp-row">
      <div class="nameplate" id="nameLabel">샌드백</div>
      <div class="hpbar" aria-label="체력"><div class="hp-trail" id="hpTrail"></div><div class="hp-fill" id="hpFill"></div></div>
      <div class="hpnum" id="hpNum">1000</div>
    </div>
    <div class="stats">
      <span>타격 <b id="sHits">0</b></span>
      <span>누적 데미지 <b id="sDmg">0</b></span>
      <span>최고 콤보 <b id="sBest">0</b></span>
      <span>KO <b id="sKo">0</b></span>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="combo" id="combo" hidden><span class="n" id="comboN">0</span><span class="l">COMBO</span></div>
    <div class="hint" id="hint">샌드백을 탭하거나 클릭해서 패세요 · 스페이스바 연타도 됩니다</div>
    <div class="drop" id="drop" hidden>여기에 사진을 놓으세요</div>
    <div class="ko" id="ko" hidden>
      <div class="ko-title">K.O.</div>
      <p id="koMsg"></p>
      <div class="ko-btns">
        <button id="healBtn" class="primary">치료하고 다시 패기</button>
        <button id="againBtn">멍든 채로 계속 패기</button>
      </div>
    </div>
  </main>

  <footer class="toolbar">
    <div class="row1">
      <label class="btn primary" for="file">사진 넣기</label>
      <input id="file" class="sr-only" type="file" accept="image/*">
      <input id="nameInput" maxlength="10" placeholder="이름 (예: 부장님)" aria-label="샌드백 이름">
      <button id="soundBtn" aria-pressed="true" aria-label="소리 켜기/끄기">소리 켬</button>
      <button id="resetBtn">초기화</button>
    </div>
    <div class="weapons" id="weapons" role="radiogroup" aria-label="무기"></div>
  </footer>
</div>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const DISPLAY = '"Black Han Sans","Noto Sans KR",sans-serif';
const MAX_HP = 1000;

const WEAPONS = [
  { id: 'fist',    name: '주먹',   emoji: '🥊', power: 1.0, mark: 'bruise',  sound: 'punch', words: ['퍽!', '퍼억!', '빡!', '뻑!'] },
  { id: 'kick',    name: '발차기', emoji: '🦵', power: 1.6, mark: 'bruise',  sound: 'kick',  words: ['뻐억!', '쾅!', '퍼버벅!'] },
  { id: 'slipper', name: '쓰레빠', emoji: '🩴', power: 0.8, mark: 'slipper', sound: 'slap',  words: ['짝!', '철썩!', '쫙!'] },
  { id: 'pan',     name: '프라이팬', emoji: '🍳', power: 1.8, mark: 'bruise', sound: 'pan',   words: ['댕~!', '팅!', '깡!'] },
  { id: 'hammer',  name: '망치',   emoji: '🔨', power: 2.4, mark: 'crack',   sound: 'clank', words: ['콰직!', '쾅!', '깡!'] },
  { id: 'fish',    name: '생선',   emoji: '🐟', power: 0.6, mark: 'fish',    sound: 'fish',  words: ['철퍽!', '찰싹!', '퍽!'] },
];

// ---------- state ----------
let S = { hp: MAX_HP, hits: 0, dmg: 0, best: 0, kos: 0, marks: [], name: '샌드백', weapon: 'fist' };
let combo = 0, lastHit = 0, ko = false, soundOn = true;
let theta = 0, omega = 0, sx = 1, vsx = 0, hitStop = 0, shake = 0, flash = 0;
let dents = [], parts = [];
let mouse = { x: 0, y: 0, in: false, swing: 0 };
let W = 0, H = 0, dpr = 1, G = {};
const photo = document.createElement('canvas');
photo.width = 420; photo.height = 512;
const pctx = photo.getContext('2d');

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const weapon = () => WEAPONS.find((w) => w.id === S.weapon) || WEAPONS[0];
function josa(word, withBatchim, without) {
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return word + withBatchim + '(' + without + ')';
  return word + ((c - 0xac00) % 28 ? withBatchim : without);
}

// ---------- photo ----------
function drawDefaultFace() {
  const w = photo.width, h = photo.height, c = pctx;
  const bg = c.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#f5d2ad'); bg.addColorStop(1, '#e2a97c');
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  c.fillStyle = '#2b1a14';
  c.beginPath(); c.ellipse(w / 2, h * 0.05, w * 0.62, h * 0.2, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#2b1a14'; c.lineCap = 'round'; c.lineWidth = 16;
  c.beginPath(); c.moveTo(w * 0.22, h * 0.36); c.lineTo(w * 0.42, h * 0.4); c.stroke();
  c.beginPath(); c.moveTo(w * 0.78, h * 0.36); c.lineTo(w * 0.58, h * 0.4); c.stroke();
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(w * 0.33, h * 0.47, 34, 24, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(w * 0.67, h * 0.47, 34, 24, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#1b100c';
  c.beginPath(); c.arc(w * 0.35, h * 0.48, 13, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(w * 0.65, h * 0.48, 13, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#b5704d'; c.lineWidth = 8;
  c.beginPath(); c.moveTo(w * 0.5, h * 0.52); c.lineTo(w * 0.46, h * 0.63); c.lineTo(w * 0.53, h * 0.64); c.stroke();
  c.strokeStyle = '#6b2a1c'; c.lineWidth = 10;
  c.beginPath(); c.moveTo(w * 0.36, h * 0.76); c.quadraticCurveTo(w * 0.55, h * 0.8, w * 0.68, h * 0.72); c.stroke();
  c.fillStyle = 'rgba(230,120,100,.35)';
  c.beginPath(); c.arc(w * 0.22, h * 0.62, 30, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(w * 0.78, h * 0.62, 30, 0, Math.PI * 2); c.fill();
}
function setPhoto(img, save) {
  const w = photo.width, h = photo.height;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = Math.max(w / iw, h / ih);
  const dw = iw * s, dh = ih * s;
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, w, h);
  pctx.drawImage(img, (w - dw) / 2, (h - dh) * 0.35, dw, dh);
  if (save) store.set('sandbag.photo', photo.toDataURL('image/jpeg', 0.85));
}
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    setPhoto(img, true);
    URL.revokeObjectURL(url);
    S.marks = []; S.hp = MAX_HP; ko = false; $('ko').hidden = true;
    updateHud(); persist();
  };
  img.src = url;
}

// ---------- audio ----------
let ac = null, noiseBuf = null;
function audio() {
  if (!soundOn) return null;
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch { return null; }
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function env(g, t, peak, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function tone(type, f0, f1, dur, peak, delay = 0) {
  const a = ac, t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  env(g, t, peak, dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, ftype, freq, peak, delay = 0, freqEnd) {
  const a = ac, t = a.currentTime + delay;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf;
  f.type = ftype; f.frequency.setValueAtTime(freq, t);
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  env(g, t, peak, dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
}
function sfx(kind, crit) {
  if (!audio()) return;
  const p = rand(0.9, 1.12);
  switch (kind) {
    case 'punch': tone('sine', 150 * p, 45, 0.18, 0.9); noise(0.08, 'lowpass', 1800, 0.6); break;
    case 'kick': tone('sine', 110 * p, 32, 0.3, 1); noise(0.13, 'lowpass', 1100, 0.75); break;
    case 'slap': noise(0.09, 'highpass', 1500 * p, 0.9); noise(0.05, 'bandpass', 3200, 0.5); break;
    case 'fish': noise(0.16, 'lowpass', 900 * p, 0.7); noise(0.08, 'highpass', 1200, 0.5, 0.01); break;
    case 'pan':
      tone('sine', 520 * p, 515 * p, 1.1, 0.28); tone('sine', 1310 * p, 1300 * p, 0.8, 0.14);
      tone('sine', 2150 * p, 2140 * p, 0.5, 0.08); tone('sine', 140, 50, 0.12, 0.6); break;
    case 'clank':
      tone('square', 820 * p, 780 * p, 0.25, 0.12); tone('triangle', 1260 * p, 1200 * p, 0.35, 0.2);
      noise(0.06, 'bandpass', 4000, 0.6); tone('sine', 200, 55, 0.14, 0.7); break;
    case 'miss': noise(0.22, 'bandpass', 400, 0.28, 0, 1600); break;
    case 'ko': [0, 0.28, 0.56].forEach((d) => tone('triangle', 1250, 1240, 0.5, 0.35, d)); break;
  }
  if (crit) { tone('sawtooth', 90, 40, 0.25, 0.25); noise(0.2, 'lowpass', 600, 0.5); }
}

// ---------- layout ----------
function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const top = 16, avail = H - top - 30;
  const L = Math.max(24, avail * 0.12);
  let bh = avail - L, bw = bh * 0.6;
  if (bw > W * 0.74) { bw = W * 0.74; bh = bw / 0.6; }
  const rx = bw * 0.4;
  G = { px: W / 2, py: top, L, bw, bh, fy: -bh * 0.1, rx, ry: rx * 1.22, floor: H - 14 };
}

// screen point -> bag coords (origin = bag center, before squash)
function toBag(x, y) {
  const dx = x - G.px, dy = y - G.py;
  const c = Math.cos(-theta), s = Math.sin(-theta);
  const lx = dx * c - dy * s, ly = dx * s + dy * c;
  const sy = 2 - sx;
  return { x: lx / sx, y: (ly - G.L) / sy - G.bh / 2 };
}

// ---------- hitting ----------
function makeMark(type, bx, by, power) {
  const bw = G.bw;
  const m = { type, x: bx / bw, y: by / bw, t: Date.now(), rot: rand(-Math.PI, Math.PI), r: rand(0.07, 0.11) * (0.7 + power * 0.35), a: rand(0.3, 0.45) };
  if (type === 'crack') {
    m.lines = [];
    const n = 5 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      let ang = (i / n) * Math.PI * 2 + rand(-0.3, 0.3), x = 0, y = 0;
      const pts = [[0, 0]], len = rand(0.6, 1.3), seg = 4;
      for (let k = 0; k < seg; k++) {
        ang += rand(-0.5, 0.5);
        x += Math.cos(ang) * len / seg; y += Math.sin(ang) * len / seg;
        pts.push([x, y]);
      }
      m.lines.push(pts);
    }
  }
  S.marks.push(m);
  if (S.marks.length > 160) S.marks.shift();
}

function hit(x, y) {
  if (ko) return;
  const b = toBag(x, y);
  const w = weapon();
  mouse.swing = 0.14;
  if (Math.abs(b.x) > G.bw / 2 || Math.abs(b.y) > G.bh / 2) {
    sfx('miss');
    addText(x, y - 20, '헛스윙~', '#b5a29e', 18);
    return;
  }
  const now = performance.now();
  combo = now - lastHit < 700 ? combo + 1 : 1;
  lastHit = now;
  S.best = Math.max(S.best, combo);
  const crit = Math.random() < 0.12;
  let dmg = Math.round(30 * w.power * rand(0.7, 1.3) * (1 + Math.min(combo, 40) * 0.05));
  if (crit) dmg = Math.round(dmg * 2.5);
  S.hp = Math.max(0, S.hp - dmg);
  S.hits++; S.dmg += dmg;

  // physics
  const side = b.x >= 0 ? -1 : 1;
  omega += side * w.power * (0.8 + Math.abs(b.x) / G.bw * 1.6) * (crit ? 1.8 : 1);
  vsx += 2.2 * w.power * (crit ? 1.6 : 1);
  dents.push({ x: b.x, y: b.y, t: now, s: Math.min(0.55, 0.22 + w.power * 0.12) * (crit ? 1.4 : 1) });
  if (dents.length > 6) dents.shift();
  if (!reduceMotion) shake = Math.min(18, shake + 4 * w.power * (crit ? 2 : 1));
  flash = crit ? 0.22 : 0.08;
  if (crit) hitStop = 0.07;

  makeMark(w.mark, b.x, b.y, w.power * (crit ? 1.5 : 1));
  if (w.mark !== 'bruise' && Math.random() < 0.5) makeMark('bruise', b.x + rand(-6, 6), b.y + rand(-6, 6), w.power * 0.6);

  // fx
  burst(x, y, w, crit);
  addText(x + rand(-30, 30), y - rand(30, 50), pick(w.words), '#fff', crit ? 46 : 34, true);
  addText(x + rand(20, 50), y - 10, (crit ? '크리티컬! ' : '') + '-' + dmg, crit ? '#ff4b3a' : '#ffc93c', crit ? 26 : 20);
  parts.push({ kind: 'weapon', x, y, life: 0.26, max: 0.26, emoji: w.emoji, rot: rand(-0.5, 0.2) });
  if (crit && Math.random() < 0.5) parts.push({ kind: 'emoji', emoji: '🦷', x, y, vx: rand(-260, 260), vy: rand(-520, -320), life: 2.2, max: 2.2, rot: 0, vr: rand(-12, 12), size: 26 });
  try { navigator.vibrate && navigator.vibrate(crit ? 40 : 15); } catch {}
  sfx(w.sound, crit);
  $('hint').hidden = true;

  if (S.hp <= 0) knockout();
  updateHud();
  persistSoon();
}

function burst(x, y, w, crit) {
  const n = crit ? 22 : 12;
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(250, 700) * (crit ? 1.3 : 1);
    parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.15, 0.32), max: 0.32, color: Math.random() < 0.5 ? '#fff6d0' : '#ffc93c' });
  }
  const drops = w.id === 'fish' ? 10 : 4;
  for (let i = 0; i < drops; i++) {
    parts.push({ kind: 'drop', x, y, vx: rand(-300, 300), vy: rand(-450, -150), life: rand(0.6, 1), max: 1, size: rand(3, 6), color: w.id === 'fish' ? '#9fd6e6' : '#cfe9ff' });
  }
  if (crit) for (let i = 0; i < 5; i++) parts.push({ kind: 'star', x, y, vx: rand(-260, 260), vy: rand(-380, -120), life: 0.8, max: 0.8, rot: rand(0, 6), vr: rand(-10, 10) });
}
function addText(x, y, text, color, size, punchy) {
  parts.push({ kind: 'text', x, y, vx: 0, vy: -60, life: punchy ? 0.6 : 0.9, max: punchy ? 0.6 : 0.9, text, color, size, rot: punchy ? rand(-0.25, 0.25) : 0 });
}

function knockout() {
  ko = true; S.kos++;
  omega += (omega >= 0 ? 1 : -1) * 4;
  sfx('ko');
  const n = S.name || '샌드백';
  $('koMsg').textContent = pick([
    josa(n, '을', '를') + ' 때려눕혔습니다',
    josa(n, '이', '가') + ' 링 바닥에 누웠습니다',
    josa(n, '은', '는') + ' 더 이상 버틸 수 없습니다',
  ]) + ` · 최고 ${S.best}콤보`;
  setTimeout(() => { $('ko').hidden = false; $('healBtn').focus({ preventScroll: true }); }, 650);
}
function revive(heal) {
  S.hp = MAX_HP; ko = false; combo = 0;
  if (heal) S.marks = [];
  $('ko').hidden = true;
  updateHud(); persist();
}

// ---------- drawing ----------
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function dentAmp(d, now) {
  const t = (now - d.t) / 1000;
  return d.s * Math.exp(-t * 7) * (Math.cos(t * 28) * 0.6 + 0.4);
}

function drawPhoto(now) {
  const { rx, ry, fy } = G;
  const N = 14, M = 17, tw = (2 * rx) / N, th = (2 * ry) / M;
  const PW = photo.width / N, PH = photo.height / M, sig2 = 2 * (rx * 0.38) ** 2;
  const active = dents.map((d) => ({ x: d.x, y: d.y, a: dentAmp(d, now) })).filter((d) => Math.abs(d.a) > 0.004);
  ctx.fillStyle = '#1a0b0c';
  ctx.fillRect(-rx, fy - ry, rx * 2, ry * 2);
  for (let j = 0; j < M; j++) {
    for (let i = 0; i < N; i++) {
      const cx = -rx + (i + 0.5) * tw, cy = fy - ry + (j + 0.5) * th;
      let dx = 0, dy = 0, sc = 1;
      for (const d of active) {
        const vx = cx - d.x, vy = cy - d.y;
        const g = Math.exp(-(vx * vx + vy * vy) / sig2);
        dx -= vx * d.a * g * 0.9; dy -= vy * d.a * g * 0.9;
        sc -= d.a * g * 0.35;
      }
      const w = tw * sc + 1, h = th * sc + 1;
      ctx.drawImage(photo, i * PW, j * PH, PW, PH, cx + dx - w / 2, cy + dy - h / 2, w, h);
    }
  }
  for (const d of active) {
    if (d.a <= 0) continue;
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, rx * 0.5);
    g.addColorStop(0, `rgba(0,0,0,${Math.min(0.6, d.a)})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(-rx, fy - ry, rx * 2, ry * 2);
  }
}

function drawMark(m, now) {
  const bw = G.bw, x = m.x * bw, y = m.y * bw, r = m.r * bw;
  ctx.save();
  ctx.translate(x, y);
  if (m.type === 'bruise') {
    const k = Math.min(1, (now - m.t) / 2500);
    const c = [215 + (95 - 215) * k, 40 + (28 - 40) * k, 45 + (85 - 45) * k].map(Math.round).join(',');
    ctx.globalCompositeOperation = 'multiply';
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(${c},${m.a + 0.15})`); g.addColorStop(0.55, `rgba(${c},${m.a * 0.6})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.scale(1, 0.85); ctx.rotate(m.rot);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  } else if (m.type === 'crack') {
    ctx.rotate(m.rot);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const pass = (color, w, off) => {
      ctx.strokeStyle = color; ctx.lineWidth = w;
      for (const pts of m.lines) {
        ctx.beginPath();
        pts.forEach(([px, py], i) => (i ? ctx.lineTo(px * r + off, py * r + off) : ctx.moveTo(px * r + off, py * r + off)));
        ctx.stroke();
      }
    };
    pass('rgba(255,255,255,.25)', Math.max(1, bw * 0.005), 1);
    pass('rgba(25,8,8,.85)', Math.max(1.5, bw * 0.007), 0);
  } else if (m.type === 'slipper') {
    ctx.rotate(m.rot);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(215,50,50,.42)';
    const L = r * 1.5, Wd = r * 0.6;
    ctx.beginPath();
    ctx.ellipse(0, -L * 0.25, Wd, L * 0.5, 0, 0, Math.PI * 2);
    ctx.ellipse(0, L * 0.38, Wd * 0.8, L * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,20,30,.35)'; ctx.lineWidth = Math.max(1, r * 0.08);
    for (let i = -4; i <= 5; i++) { ctx.beginPath(); ctx.moveTo(-Wd * 0.7, i * L * 0.1); ctx.lineTo(Wd * 0.7, i * L * 0.1); ctx.stroke(); }
  } else if (m.type === 'fish') {
    ctx.rotate(m.rot);
    ctx.fillStyle = 'rgba(140,195,210,.26)';
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.5, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(r * (i - 1.5) * 0.9, r * (i % 2 ? 0.9 : -0.9), r * 0.18, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.2, r * 0.6, r * 0.2, 0, Math.PI * 1.1, Math.PI * 1.8); ctx.stroke();
  }
  ctx.restore();
}

function drawBag(now) {
  const { L, bw, bh, fy, rx, ry } = G;
  ctx.save();
  ctx.translate(G.px, G.py);
  ctx.rotate(theta);
  // chain
  ctx.strokeStyle = '#9aa0a6'; ctx.lineWidth = 2.5;
  const n = Math.max(3, Math.floor(L / 11));
  for (let i = 0; i < n; i++) {
    const y = (i + 0.5) * (L / n);
    ctx.beginPath();
    if (i % 2) ctx.ellipse(0, y, 1.5, L / n * 0.65, 0, 0, Math.PI * 2);
    else ctx.ellipse(0, y, 4.5, L / n * 0.65, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.strokeStyle = '#6d7277'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, L); ctx.lineTo(-bw * 0.34, L + 4); ctx.moveTo(0, L); ctx.lineTo(bw * 0.34, L + 4); ctx.stroke();

  const sy = 2 - sx;
  ctx.translate(0, L);
  ctx.scale(sx, sy);
  ctx.translate(0, bh / 2);

  // body
  roundRect(ctx, -bw / 2, -bh / 2, bw, bh, bw * 0.2);
  const leather = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  leather.addColorStop(0, '#4a1012'); leather.addColorStop(0.22, '#a3262a'); leather.addColorStop(0.42, '#cf3b33');
  leather.addColorStop(0.7, '#9e2428'); leather.addColorStop(1, '#3c0c0e');
  ctx.fillStyle = leather; ctx.fill();
  ctx.save();
  ctx.clip();
  const band = bh * 0.09;
  ctx.fillStyle = 'rgba(25,6,7,.75)';
  ctx.fillRect(-bw / 2, -bh / 2, bw, band);
  ctx.fillRect(-bw / 2, bh / 2 - band, bw, band);
  ctx.strokeStyle = 'rgba(255,220,180,.32)'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
  [-bh / 2 + band - 4, bh / 2 - band + 4].forEach((yy) => { ctx.beginPath(); ctx.moveTo(-bw / 2, yy); ctx.lineTo(bw / 2, yy); ctx.stroke(); });
  ctx.setLineDash([]);

  // face
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, fy, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
  drawPhoto(now);
  ctx.restore();
  ctx.lineWidth = bw * 0.028; ctx.strokeStyle = '#2b0c0d';
  ctx.beginPath(); ctx.ellipse(0, fy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,220,180,.35)'; ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.ellipse(0, fy, rx + bw * 0.028, ry + bw * 0.028, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // name
  ctx.fillStyle = '#ffc93c';
  ctx.font = `${Math.round(bw * 0.13)}px ${DISPLAY}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(S.name || '샌드백', 0, bh * 0.3, bw * 0.8);

  for (const m of S.marks) drawMark(m, Date.now());

  // gloss
  const gl = ctx.createLinearGradient(-bw / 2, 0, 0, 0);
  gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(0.55, 'rgba(255,255,255,.1)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(-bw / 2, -bh / 2, bw / 2, bh);
  ctx.restore();

  // dizzy stars
  if (S.hp / MAX_HP < 0.3) {
    const t = now / 1000;
    ctx.font = `${Math.round(bw * 0.09)}px ${EMOJI}`;
    for (let i = 0; i < 3; i++) {
      const a = t * 3 + (i * Math.PI * 2) / 3;
      const ox = Math.cos(a) * rx * 0.9, oy = fy - ry - bw * 0.02 + Math.sin(a) * rx * 0.18;
      ctx.globalAlpha = Math.sin(a) > 0 ? 1 : 0.55;
      ctx.fillText('💫', ox, oy);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    const k = p.life / p.max;
    if (p.vx !== undefined) {
      if (p.kind === 'drop' || p.kind === 'star' || p.kind === 'emoji') p.vy += 1400 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'emoji' && p.y > G.floor - p.size / 2) { p.y = G.floor - p.size / 2; p.vy *= -0.45; p.vx *= 0.7; }
    }
    if (p.vr) p.rot += p.vr * dt;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 2);
    if (p.kind === 'spark') {
      ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
    } else if (p.kind === 'drop') {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'star') {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = '#ffe36b'; ctx.font = `22px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', 0, 0);
    } else if (p.kind === 'emoji') {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.font = `${p.size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, 0, 0);
    } else if (p.kind === 'text') {
      const age = p.max - p.life, s = age < 0.08 ? 1.6 - (age / 0.08) * 0.6 : 1;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(s, s);
      ctx.font = `${p.size}px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(3, p.size * 0.16); ctx.strokeStyle = '#1a0606'; ctx.lineJoin = 'round';
      ctx.strokeText(p.text, 0, 0); ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
    } else if (p.kind === 'weapon') {
      const age = p.max - p.life, s = age < 0.06 ? 1.7 - (age / 0.06) * 0.7 : 1;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(s, s);
      ctx.font = `64px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, 0, 0);
    }
    ctx.restore();
  }
}

function drawCursor(dt) {
  if (!mouse.in || ko) return;
  mouse.swing = Math.max(0, mouse.swing - dt);
  const s = 1 + mouse.swing * 3;
  ctx.save();
  ctx.translate(mouse.x, mouse.y); ctx.rotate(-0.35 + mouse.swing * 3); ctx.scale(s, s);
  ctx.font = `48px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.95;
  ctx.fillText(weapon().emoji, 0, 0);
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (hitStop > 0) hitStop -= dt;
  else {
    const steps = 3, h = dt / steps;
    for (let i = 0; i < steps; i++) {
      omega += (-14 * Math.sin(theta) - 1.1 * omega) * h;
      theta += omega * h;
      vsx += (-(sx - 1) * 420 - vsx * 16) * h;
      sx += vsx * h;
    }
    theta = Math.max(-1.25, Math.min(1.25, theta));
    sx = Math.max(0.8, Math.min(1.25, sx));
  }
  dents = dents.filter((d) => now - d.t < 900);
  shake *= Math.pow(0.0008, dt);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  // ceiling mount and floor shadow
  ctx.fillStyle = '#0d0809'; ctx.fillRect(G.px - 34, 0, 68, G.py);
  ctx.fillStyle = '#4b5055'; ctx.beginPath(); ctx.arc(G.px, G.py, 5, 0, Math.PI * 2); ctx.fill();
  const swingX = G.px + Math.sin(theta) * (G.L + G.bh);
  const sh = ctx.createRadialGradient(swingX, G.floor, 0, swingX, G.floor, G.bw * 0.7);
  sh.addColorStop(0, 'rgba(0,0,0,.55)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.ellipse(swingX, G.floor, G.bw * 0.7, 12, 0, 0, Math.PI * 2); ctx.fill();

  drawBag(now);
  drawParts(dt);
  ctx.restore();
  drawCursor(dt);

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,245,220,${flash})`; ctx.fillRect(0, 0, W, H);
    flash = Math.max(0, flash - dt * 1.6);
  }
  if (combo >= 3 && now - lastHit > 1100) { combo = 0; $('combo').hidden = true; }
  requestAnimationFrame(frame);
}

// ---------- HUD ----------
function updateHud() {
  const pct = (S.hp / MAX_HP) * 100;
  $('hpFill').style.width = pct + '%';
  $('hpTrail').style.width = pct + '%';
  $('hpFill').classList.toggle('low', pct < 30);
  $('hpNum').textContent = S.hp;
  $('sHits').textContent = S.hits.toLocaleString('ko-KR');
  $('sDmg').textContent = S.dmg.toLocaleString('ko-KR');
  $('sBest').textContent = S.best;
  $('sKo').textContent = S.kos;
  $('nameLabel').textContent = S.name || '샌드백';
  const c = $('combo');
  if (combo >= 3) {
    c.hidden = false;
    $('comboN').textContent = combo;
    c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  }
}
function persist() {
  store.set('sandbag.state', JSON.stringify({ ...S, marks: S.marks.slice(-80) }));
}
let pt = 0;
function persistSoon() { clearTimeout(pt); pt = setTimeout(persist, 400); }

function buildWeapons() {
  const box = $('weapons');
  WEAPONS.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'weapon';
    b.setAttribute('role', 'radio');
    b.dataset.id = w.id;
    b.innerHTML = `<span class="e">${w.emoji}</span><span>${w.name}</span><span class="k">${i + 1} · 위력 ${w.power}</span>`;
    b.addEventListener('click', () => selectWeapon(w.id));
    box.appendChild(b);
  });
}
function selectWeapon(id) {
  S.weapon = id;
  document.querySelectorAll('.weapon').forEach((b) => b.setAttribute('aria-checked', b.dataset.id === id ? 'true' : 'false'));
  persistSoon();
}

// ---------- input ----------
function local(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.ko')) return;
  e.preventDefault();
  const p = local(e);
  hit(p.x, p.y);
});
stage.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const p = local(e);
  mouse.x = p.x; mouse.y = p.y; mouse.in = true;
  stage.classList.add('mouse');
});
stage.addEventListener('pointerleave', () => { mouse.in = false; stage.classList.remove('mouse'); });

window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, button')) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Enter' || e.key === ' ') return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (ko) return;
    const a = rand(0, Math.PI * 2), r = rand(0, 0.8);
    const bx = Math.cos(a) * G.rx * r, by = G.fy + Math.sin(a) * G.ry * r;
    const c = Math.cos(theta), s = Math.sin(theta), sy = 2 - sx;
    const lx = bx * sx, ly = G.L + (by + G.bh / 2) * sy;
    hit(G.px + lx * c - ly * s, G.py + lx * s + ly * c);
  } else if (/^[1-6]$/.test(e.key)) {
    selectWeapon(WEAPONS[+e.key - 1].id);
  }
});

$('file').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; $('drop').hidden = false; });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; $('drop').hidden = true;
  loadFile(e.dataTransfer.files[0]);
});
window.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

$('nameInput').addEventListener('input', (e) => {
  S.name = e.target.value.trim() || '샌드백';
  $('nameLabel').textContent = S.name;
  persistSoon();
});
$('soundBtn').addEventListener('click', (e) => {
  soundOn = !soundOn;
  e.currentTarget.setAttribute('aria-pressed', soundOn);
  e.currentTarget.textContent = soundOn ? '소리 켬' : '소리 끔';
  store.set('sandbag.sound', soundOn ? '1' : '0');
});
$('resetBtn').addEventListener('click', () => {
  S = { hp: MAX_HP, hits: 0, dmg: 0, best: 0, kos: 0, marks: [], name: S.name, weapon: S.weapon };
  combo = 0; ko = false; $('ko').hidden = true; $('combo').hidden = true;
  drawDefaultFace(); store.del('sandbag.photo');
  updateHud(); persist();
});
$('healBtn').addEventListener('click', () => revive(true));
$('againBtn').addEventListener('click', () => revive(false));

// ---------- boot ----------
function start(hot) {
  try { const saved = JSON.parse(store.get('sandbag.state') || 'null'); if (saved) S = { ...S, ...saved }; } catch {}
  if (hot && hot.S) S = hot.S;
  if (S.hp <= 0) S.hp = MAX_HP;
  soundOn = store.get('sandbag.sound') !== '0';
  $('soundBtn').setAttribute('aria-pressed', soundOn);
  $('soundBtn').textContent = soundOn ? '소리 켬' : '소리 끔';
  if (S.name && S.name !== '샌드백') $('nameInput').value = S.name;
  drawDefaultFace();
  const savedPhoto = store.get('sandbag.photo');
  if (savedPhoto) { const img = new Image(); img.onload = () => setPhoto(img, false); img.src = savedPhoto; }
  buildWeapons();
  selectWeapon(S.weapon);
  resize();
  new ResizeObserver(resize).observe(stage);
  updateHud();
  requestAnimationFrame((t) => { last = t; frame(t); });
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
